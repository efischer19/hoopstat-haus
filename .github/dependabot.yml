version: 2

# Dependabot's network proxy blocks any package index not declared here.
# bronze-ingestion uses piwheels as a supplemental source (ADR-029), so it
# must be listed or every bronze update fails with
# private_source_authentication_failure.
registries:
  piwheels:
    type: python-index
    url: https://www.piwheels.org/simple/

updates:
  # Monitor pip dependencies in the Python app template
  - package-ecosystem: "pip"
    directory: "/templates/python-app-template"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip:
        patterns:
          - "*"

  # Monitor pip dependencies in bronze-ingestion
  - package-ecosystem: "pip"
    directory: "/apps/bronze-ingestion"
    registries:
      - piwheels
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip:
        patterns:
          - "*"

  # Monitor pip dependencies in silver-processing
  - package-ecosystem: "pip"
    directory: "/apps/silver-processing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip:
        patterns:
          - "*"

  # Monitor pip dependencies in gold-analytics
  - package-ecosystem: "pip"
    directory: "/apps/gold-analytics"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip:
        patterns:
          - "*"

  # Monitor pip dependencies in mcp-local-proxy
  - package-ecosystem: "pip"
    directory: "/apps/mcp-local-proxy"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip:
        patterns:
          - "*"

  # Monitor pip dependencies in health-aggregator
  - package-ecosystem: "pip"
    directory: "/apps/health-aggregator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip:
        patterns:
          - "*"

  # Monitor pip dependencies in db-compiler
  - package-ecosystem: "pip"
    directory: "/apps/db-compiler"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      pip:
        patterns:
          - "*"

  # NOTE: When adding new Python applications to /apps/, 
  # add a new entry following this pattern:
  #
  # - package-ecosystem: "pip"
  #   directory: "/apps/your-app-name"
  #   schedule:
  #     interval: "weekly"
  #   open-pull-requests-limit: 10
  #   groups:
  #     pip:
  #       patterns:
  #         - "*"
  #
  # Unfortunately, Dependabot doesn't support wildcard directories,
  # so each new app directory must be explicitly configured here.
